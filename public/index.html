<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚡ Apply saved theme INSTANTLY — runs before CSS renders, prevents any flash -->
    <script>
      try {
        var _t = localStorage.getItem('vector_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', _t);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VECTOR — Fleet Intelligence</title>
    <meta name="description" content="Real-time IoT vehicle tracking dashboard" />

    <!-- ── Google Fonts (already used in VECTOR) ────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />

    <!-- ── Firebase Compat SDK (v10) — order matters ────────────────────── -->
    <!-- Core App -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <!-- Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <!-- Authentication SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <!-- ── Leaflet Map ───────────────────────────────────────────────────── -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- ── Chart.js (used by analytics module) ──────────────────────────── -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- ── App Styles ────────────────────────────────────────────────────── -->
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <link rel="stylesheet" href="/src/styles/login.css" />
  </head>

  <body>

    <!-- ═══════════════════════════════════════════════════════════════════
         ★ NEW: LOGIN PAGE
         Hidden after successful auth; shown on logout / unauthenticated.
         Controlled entirely by auth.js (showLoginPage / showDashboard).
    ════════════════════════════════════════════════════════════════════ -->
    <div id="login-page" aria-label="Admin Login">
      <div class="login-card" role="main">

        <!-- Logo / Wordmark -->
        <div class="login-logo">
          <div class="login-logo-icon" aria-hidden="true">
            <!-- VECTOR actual logo image -->
            <img
              src="/assets/vector-logo-icon.png"
              alt="VECTOR Logo"
              class="login-logo-img"
              onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
            />
            <!-- Fallback SVG if image fails to load -->
            <svg style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 11 22 2 13 21 11 13 3 11"/>
            </svg>
          </div>
          <div class="login-wordmark">VE<span>C</span>TOR</div>
          <div class="login-tagline">Fleet Intelligence Platform</div>
        </div>

        <!-- Form heading -->
        <div class="login-header">
          <h1 class="login-title">Admin Sign In</h1>
          <p class="login-subtitle">Enter your credentials to access the dashboard.</p>
        </div>

        <!-- Auth Form -->
        <form class="login-form" id="login-form" novalidate autocomplete="on">

          <!-- Email Field -->
          <div class="login-field">
            <label class="login-label" for="login-email">Email Address</label>
            <div class="login-input-wrap">
              <input
                id="login-email"
                class="login-input"
                type="email"
                name="email"
                placeholder="admin@example.com"
                autocomplete="email"
                required
                spellcheck="false"
              />
            </div>
          </div>

          <!-- Password Field -->
          <div class="login-field">
            <label class="login-label" for="login-password">Password</label>
            <div class="login-input-wrap">
              <input
                id="login-password"
                class="login-input has-toggle"
                type="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button
                id="toggle-password"
                class="login-toggle-password"
                type="button"
                aria-label="Show password"
              >
                <!-- Eye icon (password hidden state — default) -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Error Message -->
          <div id="login-error" class="login-error" hidden role="alert" aria-live="assertive">
            <svg class="login-error-icon" xmlns="http://www.w3.org/2000/svg"
                 width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="login-error-text"></span>
          </div>

          <!-- Submit Button -->
          <button id="login-submit" class="login-submit" type="submit">
            <span id="login-spinner" class="login-spinner" hidden aria-hidden="true"></span>
            <span id="login-btn-text">Sign In</span>
          </button>

        </form>

        <!-- Footer -->
        <div class="login-footer">
          &copy; 2025 VECTOR &mdash; Restricted Access
        </div>

      </div>
    </div>
    <!-- ═══════════════════════════════════════════════════════════════════ -->


    <!-- ═══════════════════════════════════════════════════════════════════
         MAIN DASHBOARD APP
         Hidden on load; revealed after auth check passes.
         Your existing dashboard markup goes here (or is injected by JS).
    ════════════════════════════════════════════════════════════════════ -->
    <div id="app" hidden>
      <!-- Your existing dashboard HTML / dynamically injected content -->
    </div>


    <!-- ── Toast notifications container ───────────────────────────────── -->
    <div id="toasts" aria-live="polite" aria-atomic="false"></div>

    <!-- ── Entry point (ES module) ───────────────────────────────────────── -->
    <script type="module" src="/src/main.js"></script>

  </body>
</html>
